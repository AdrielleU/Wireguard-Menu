# Journal retention for the WireGuard audit trail: keep everything, for as long
# as the disk allows.
#
# Installed by `install-logging.sh` to /etc/systemd/journald.conf.d/, which is
# where drop-ins override the defaults in /etc/systemd/journald.conf without
# editing that file. It is applied only when the host has no SystemMaxUse= of
# its own — an explicit operator setting is never overridden.
#
# NOTE: journald retention is host-wide, not per-tag — these limits govern the
# whole journal, so the box needs disk for every service's logs, not just
# WireGuard's.
#
# THERE IS NO TRUE "FOREVER" ON A FINITE DISK. What this file does is remove
# the two limits that would otherwise evict entries early, leaving only the
# disk itself:
#
#   * journald's default SystemMaxUse is 10% of the filesystem, capped at 4G.
#     On a 70G root that is a 4G journal — which, on a busy host, can be weeks.
#   * The default MaxRetentionSec is already 0 (no age-based deletion), and it
#     is set explicitly below so an inherited value cannot reintroduce one.
#
# SystemKeepFree is deliberately NOT set here. It defaults to a percentage of
# the filesystem and is what now bounds the journal: journald "will respect both
# limits and use the smaller of the two values" (journald.conf(5)), so with
# SystemMaxUse effectively unbounded, journald grows the journal until that free
# reserve is reached and then evicts the oldest entries. That reserve is what
# stops the journal filling the disk, so leave it alone.
#
# CONSEQUENCE, STATED PLAINLY: eviction still happens, it just happens at the
# disk limit instead of at 4G. If the trail must outlive the disk, ship it
# off-box — retention on a single host is always bounded by that host.
#
# Check what this host can actually hold:
#
#     sudo ./install-logging.sh --check-retention
#
[Journal]
# Persist across reboots — the default on some distros is volatile /run storage,
# which would discard the entire audit trail at shutdown.
Storage=persistent
# Larger than any realistic single filesystem, so SystemKeepFree is always the
# binding limit. This is the "use the whole disk" setting; it does not reserve
# or preallocate anything, it only declines to cap below the disk.
SystemMaxUse=100T
# 0 turns off age-based deletion: entries are never dropped for being old, only
# for space. Explicit rather than inherited.
MaxRetentionSec=0
