# Journal retention for the WireGuard audit trail.
#
# Installed by `set-recoveryservice.sh --with-retention` to
# /etc/systemd/journald.conf.d/, which is where drop-ins override the defaults
# in /etc/systemd/journald.conf without editing that file.
#
# NOTE: journald retention is host-wide, not per-tag — these limits govern the
# whole journal, so the box needs disk for every service's logs, not just
# WireGuard's. Size wins over age: once SystemMaxUse is reached the oldest
# entries are dropped even if MaxRetentionSec has not elapsed. Raise
# SystemMaxUse on a busy host rather than relying on the time limit alone.
[Journal]
# Persist across reboots — the default on some distros is volatile /run storage,
# which would discard the entire audit trail at shutdown.
Storage=persistent
SystemMaxUse=2G
MaxRetentionSec=6year
