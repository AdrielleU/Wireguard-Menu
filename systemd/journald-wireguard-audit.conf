# Journal retention for the WireGuard audit trail.
#
# Installed by `install-logging.sh --with-retention` to
# /etc/systemd/journald.conf.d/, which is where drop-ins override the defaults
# in /etc/systemd/journald.conf without editing that file.
#
# NOTE: journald retention is host-wide, not per-tag — these limits govern the
# whole journal, so the box needs disk for every service's logs, not just
# WireGuard's.
#
# SIZE WINS OVER AGE. Once SystemMaxUse is reached the oldest entries are
# dropped however far short of MaxRetentionSec they are, silently. So
# MaxRetentionSec below is a ceiling, not a guarantee — the achievable window
# is SystemMaxUse divided by the host's actual journal growth rate.
#
# THE VALUE BELOW IS A STARTING POINT, NOT A UNIVERSAL ANSWER. Growth rate is
# entirely host-specific (a busy server can log an order of magnitude more than
# a quiet one), so verify it on each host instead of trusting the number:
#
#     sudo ./install-logging.sh --check-retention
#
# which measures this host's real growth and reports the window it can hold.
# Raise SystemMaxUse if it comes up short, or ship the trail off-box.
#
# Setting a large cap is safe: journald also honours SystemKeepFree (15% of the
# filesystem by default) and will stop well before filling the disk, so the
# effective limit is whichever of the two binds first.
[Journal]
# Persist across reboots — the default on some distros is volatile /run storage,
# which would discard the entire audit trail at shutdown.
Storage=persistent
# ~8G holds roughly 6 years at ~3.5MB/day. Verify with --check-retention.
SystemMaxUse=8G
MaxRetentionSec=6year
